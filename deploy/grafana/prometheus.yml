global:
  scrape_interval: 15s

scrape_configs:
  # The hub's readsb (9274) and telegraf (9273) metrics. The dashboard expects the job name "ultrafeeder".
  - job_name: "ultrafeeder"
    static_configs:
      - targets: ["hub:9273", "hub:9274"]
  # The portal's own feeder statistics (station IDs, online, rates, uptime; no locations). Feeds the "Network Feeders" dashboard.
  - job_name: "portal"
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["adsb-portal:8430"]
