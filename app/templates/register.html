{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="authpage">
<h1><span>Register</span></h1>
<div class="sub">Create an account to claim and manage your feeder.</div>
<form class="panel narrow" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="username" autofocus required data-check="username">
  <label for="email">Email address</label>
  <input type="text" id="email" name="email" autocomplete="email" inputmode="email" required data-check="email">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="new-password" required data-pwcheck data-minlen="{{ min_password }}" data-mix="{{ '1' if password_mix }}" data-confirm="#confirm">
  <div class="help">{{ password_rules }}</div>
  <label for="confirm">Confirm password</label>
  <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
  <button class="btn" type="submit">Create Account</button>
</form>
<script nonce="{{ csp_nonce() }}" src="/static/pwcheck.js" defer></script>
</div>
{% endblock %}
