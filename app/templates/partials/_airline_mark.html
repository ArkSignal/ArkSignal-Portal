<style>
/* airline and military marks beside callsigns; --mk sets the size */
.lv-logo{height:var(--mk,22px);width:var(--mk,22px);object-fit:contain;vertical-align:middle;margin-right:7px;border-radius:6px}
.lv-logo.plate{background:rgba(255,255,255,.94);padding:2px}
.lv-badge{display:inline-block;padding:1px 6px;margin-right:6px;border-radius:6px;color:#fff;font:700 .78em 'JetBrains Mono',monospace;letter-spacing:.04em;line-height:1.3;vertical-align:middle}
</style>
<script>
// One place that decides what mark an aircraft gets: the airline's logo (from the portal's logo service), the emblem of its
// armed service when it is military, or a coloured letter badge. Pages call ADSB_MARK.html(aircraft) and set ADSB_MARK.onchange
// to redraw when a logo turns out to be missing or dark.
window.ADSB_MARK = (function () {
  var CFG = {{ mark_cfg | tojson }};
  var noLogo = new Map(), dark = new Map(), self = {onchange: null};   // noLogo: when a logo was missing (asked for again after a minute: it may have been fetched since)
  var SVG = '<svg class="lv-logo" viewBox="0 0 28 28" aria-label="Military"><rect width="28" height="28" rx="6" fill="#1d3a6b"/><path d="M14 6l1.9 4.2 4.6.5-3.4 3.1 1 4.5L14 16l-4.1 2.3 1-4.5-3.4-3.1 4.6-.5z" fill="#e8eef7"/><path d="M3 16c4 0 7 1 11 4M25 16c-4 0-7 1-11 4" stroke="#e8eef7" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
  function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  self.code = function (a) { var m = /^([A-Z]{3})[0-9]/.exec(((a && a.flight) || "").trim().toUpperCase()); return m ? m[1] : null; };
  self.color = function (code) { var h = 0; for (var i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) % 360; return "hsl(" + h + ",55%,36%)"; };
  self.service = function (a) {
    var cs = ((a && a.flight) || "").trim().toUpperCase(), best = "", svc = CFG.mil.default;
    Object.keys(CFG.mil.prefixes).forEach(function (p) { if (cs.indexOf(p) === 0 && p.length > best.length) { best = p; svc = CFG.mil.prefixes[p]; } });
    return CFG.mil.services.indexOf(svc) >= 0 ? svc : null;
  };
  function img(key, src, alt) {
    if (noLogo.has(key) && Date.now() - noLogo.get(key) < 60000) return null;
    return '<img loading="lazy" decoding="async" class="lv-logo' + (dark.get(key) ? " plate" : "") + '" alt="' + esc(alt) + '" data-mark="' + esc(key) + '" src="' + src + '">';
  }
  // the mark for an aircraft; returns "" when there is nothing to show
  self.html = function (a, letters) {
    var code = self.code(a);
    if (code && CFG.logos) { var h = img("al-" + code, "/api/airline-logo/" + code + ".png", code); if (h) return h; }
    if (a && a.mil) { var s = self.service(a); if (s) { var m = img("mil-" + s, "/static/mil/" + s + ".png", s.toUpperCase()); if (m) return m; } return SVG; }
    if (code) return '<span class="lv-badge" style="background:' + self.color(code) + '">' + code + "</span>";
    return "";
  };
  // true when html() fell back to the letter badge (the callsign then shows only its number)
  self.isBadge = function (a) { return self.html(a).indexOf("lv-badge") >= 0; };
  document.addEventListener("error", function (e) {
    var k = e.target && e.target.dataset && e.target.dataset.mark;
    if (k && !(noLogo.has(k) && Date.now() - noLogo.get(k) < 60000)) { noLogo.set(k, Date.now()); if (self.onchange) self.onchange(); }
  }, true);
  document.addEventListener("load", function (e) {
    var im = e.target, k = im && im.dataset && im.dataset.mark;
    if (!k || dark.has(k)) return;
    var isDark = false;
    try {
      var c = document.createElement("canvas"); c.width = c.height = 16; var x = c.getContext("2d"); x.drawImage(im, 0, 0, 16, 16);
      var px = x.getImageData(0, 0, 16, 16).data, sum = 0, n = 0;
      for (var i = 0; i < px.length; i += 4) if (px[i + 3] > 128) { sum += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; n++; }
      isDark = n > 0 && sum / n < 110;
    } catch (err) {}
    dark.set(k, isDark);
    if (isDark && self.onchange) self.onchange();
  }, true);
  return self;
})();
</script>
